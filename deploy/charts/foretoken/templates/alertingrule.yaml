{{/* Installs Foretoken alert rules into an existing Prometheus Operator. */}}

{{- if and (eq (include "foretoken.observabilityEnabled" .) "true") .Values.observability.alerts.rules }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: {{ include "foretoken.compactName" (printf "%s-alerting-rules" (include "foretoken.fullname" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.observabilityLabels" . | nindent 4 }}
spec:
{{- $definition := .Files.Get "files/alerting-rules.yaml" | fromYaml -}}
{{- range $group := $definition.groups -}}
{{- $enabledRules := list -}}
{{- range $rule := $group.rules -}}
{{- if has $rule.alert $.Values.observability.alerts.rules -}}
{{- $enabledRules = append $enabledRules $rule -}}
{{- end -}}
{{- end -}}
{{- $_ := set $group "rules" $enabledRules -}}
{{- end -}}
{{- $rules := toYaml $definition -}}
{{- $rules = replace "foretoken_alert_language" (.Values.observability.alerts.language | toString) $rules -}}
{{- $rules = include "foretoken.substituteAlertThresholds" (dict "text" $rules "thresholds" .Values.observability.alerts.thresholds) -}}
{{ $rules | nindent 2 }}
{{- end }}
