{{/* Makes the single Foretoken system dashboard discoverable by Grafana sidecars. */}}

{{- if eq (include "foretoken.observabilityEnabled" .) "true" }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "foretoken.compactName" (printf "%s-system-dashboard" (include "foretoken.fullname" .)) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "foretoken.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  foretoken-system-overview.json: |-
{{- $dashboard := .Files.Get "files/grafana/foretoken-system-overview.json" | fromJson -}}
{{- $alerts := .Values.observability.alerts -}}
{{- $thresholdRules := dict
  "foretoken_alert_threshold_kv_cache_usage_ratio" "ForetokenModelServerKVCachePressureHigh"
  "foretoken_alert_threshold_nvidia_temperature_celsius" "ForetokenNVIDIAGPUTemperatureHigh"
  "foretoken_alert_threshold_nvidia_power_watts" "ForetokenNVIDIAGPUPowerUsageHigh"
-}}
{{- range $panel := $dashboard.panels -}}
{{- range $step := dig "fieldConfig" "defaults" "thresholds" "steps" (list) $panel -}}
{{- $threshold := toString $step.value -}}
{{- if and (hasKey $thresholdRules $threshold) (not (has (get $thresholdRules $threshold) $alerts.rules)) -}}
{{- $_ := unset $panel.fieldConfig.defaults "thresholds" -}}
{{- $_ := unset $panel.fieldConfig.defaults.custom "thresholdsStyle" -}}
{{- end -}}
{{- end -}}
{{- end -}}
{{ include "foretoken.substituteAlertThresholds" (dict "text" (toPrettyJson $dashboard) "thresholds" .Values.observability.alerts.thresholds) | nindent 4 }}
{{- end }}
