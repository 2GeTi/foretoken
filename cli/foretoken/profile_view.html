<!doctype html>
<html lang="en">
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Foretoken captures</title>
  <style>
    :root {
      color-scheme: light dark;
      font:
        15px/1.5 system-ui,
        sans-serif;
      --bg: #f7f8fa;
      --fg: #172231;
      --panel: #fff;
      --border: #ccd4df;
      --muted: #526172;
      --selected: #e5efff;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #131923;
        --fg: #ecf0f5;
        --panel: #1c2532;
        --border: #435166;
        --muted: #b3bdcc;
        --selected: #293f60;
      }
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--fg);
    }
    header {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--border);
    }
    h1 {
      font-size: 20px;
      margin: 0;
    }
    header p {
      margin: 0;
      color: var(--muted);
    }
    button,
    select {
      font: inherit;
      color: inherit;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 5px;
      padding: 7px 12px;
    }
    button {
      cursor: pointer;
    }
    button:disabled {
      cursor: default;
      opacity: 0.6;
    }
    header button {
      margin-left: auto;
    }
    main {
      display: grid;
      grid-template-columns: minmax(240px, 310px) minmax(0, 1fr);
      min-height: calc(100vh - 80px);
    }
    aside {
      padding: 16px;
      border-right: 1px solid var(--border);
      max-height: calc(100vh - 80px);
      overflow: auto;
    }
    #runs {
      display: grid;
      gap: 10px;
    }
    .run {
      text-align: left;
      overflow-wrap: anywhere;
      width: 100%;
    }
    .run[aria-pressed="true"] {
      background: var(--selected);
      border-color: #5382b8;
    }
    .run span {
      display: block;
    }
    .detail {
      font-size: 12px;
      color: var(--muted);
    }
    section {
      padding: 16px;
      min-width: 0;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    select {
      max-width: 100%;
      min-width: 0;
    }
    #status {
      color: var(--muted);
      margin: 12px 0;
      min-height: 23px;
      overflow-wrap: anywhere;
    }
    iframe {
      width: 100%;
      height: calc(100vh - 190px);
      min-height: 400px;
      border: 1px solid var(--border);
      background: var(--panel);
    }
    [hidden] {
      display: none !important;
    }
    button:focus-visible,
    select:focus-visible {
      outline: 2px solid #5382b8;
      outline-offset: 2px;
    }
    @media (max-width: 700px) {
      header {
        flex-wrap: wrap;
        padding: 16px;
      }
      header p {
        width: 100%;
        order: 3;
      }
      main {
        grid-template-columns: 1fr;
      }
      aside {
        max-height: 260px;
        border-right: 0;
        border-bottom: 1px solid var(--border);
      }
      iframe {
        height: 70vh;
      }
    }
  </style>
  <header>
    <h1>Foretoken captures</h1>
    <p>Browse retained inference profiles</p>
    <button id="refresh">Refresh</button>
  </header>
  <main>
    <aside><div id="runs" aria-label="Capture history"></div></aside>
    <section>
      <div class="toolbar">
        <label for="files">Trace</label
        ><select id="files" disabled></select
        ><button id="open" disabled>Open in Perfetto</button
        ><button id="retry" hidden>Retry</button>
      </div>
      <p id="status" role="status">Loading capture history…</p>
      <div id="viewer"></div>
    </section>
  </main>
  <script>
    const $ = (id) => document.getElementById(id),
      perfettoOrigin = "https://ui.perfetto.dev";
    let runs = [],
      selected = null,
      selection = 0,
      frame = null,
      ping = null,
      handshakeTimeout = null,
      listener = null;
    const message = (text) => {
      $("status").textContent = text;
    };
    function clearViewer() {
      clearInterval(ping);
      clearTimeout(handshakeTimeout);
      if (listener) window.removeEventListener("message", listener);
      listener = null;
      $("viewer").replaceChildren();
      frame = null;
    }
    async function request(path) {
      const response = await fetch(path, { cache: "no-store" });
      if (!response.ok) {
        const body = await response.json();
        throw new Error(body.error || `Request failed (${response.status})`);
      }
      return response;
    }
    function renderRuns() {
      $("runs").replaceChildren();
      for (const run of runs) {
        const button = document.createElement("button");
        button.className = "run";
        button.setAttribute("aria-pressed", String(selected?.id === run.id));
        const title = document.createElement("span");
        title.textContent = run.model || run.service;
        const detail = document.createElement("span");
        detail.className = "detail";
        detail.textContent = `${new Date(run.time).toLocaleString()} · ${run.status}`;
        const name = document.createElement("span");
        name.className = "detail";
        name.textContent = run.model ? run.service : "Model not recorded";
        button.append(title, detail, name);
        button.onclick = () => selectRun(run);
        $("runs").append(button);
      }
    }
    async function refresh() {
      $("refresh").disabled = true;
      try {
        runs = await (await request("api/runs")).json();
        const next =
          runs.find((r) => r.id === selected?.id) ||
          runs.find((r) => r.status === "Succeeded" && r.has_result) ||
          runs[0];
        if (next) await selectRun(next);
        else {
          selection++;
          selected = null;
          clearViewer();
          renderRuns();
          $("files").replaceChildren();
          $("files").disabled = true;
          $("open").disabled = true;
          $("retry").hidden = true;
          message("No captures recorded for this deployment.");
        }
      } catch (error) {
        message(`Unable to read history: ${error.message}`);
      } finally {
        $("refresh").disabled = false;
      }
    }
    async function selectRun(run) {
      const ticket = ++selection;
      selected = run;
      clearViewer();
      renderRuns();
      $("files").replaceChildren();
      $("files").disabled = true;
      $("open").disabled = true;
      $("retry").hidden = true;
      if (!run.has_result) {
        message(`${run.status}: no published result.`);
        return;
      }
      message("Reading capture files…");
      try {
        const files = await (
          await request(`api/files?run=${encodeURIComponent(run.id)}`)
        ).json();
        if (ticket !== selection) return;
        const runtimes = [
          ...new Set(files.map((file) => file.name.split("/")[0])),
        ];
        for (const file of files) {
          const [runtime, filename] = file.name.split("/");
          const rank = filename.split(".")[0];
          const option = document.createElement("option");
          option.value = file.name;
          option.textContent = `Instance ${runtimes.indexOf(runtime) + 1} / ${rank} · ${(file.size / 1048576).toFixed(1)} MiB`;
          $("files").append(option);
        }
        $("files").disabled = !files.length;
        $("open").disabled = !files.length;
        message(
          files.length
            ? "Select a trace and open it in Perfetto."
            : "No trace files are available for this capture.",
        );
        if (files.length === 1) await openTrace();
      } catch (error) {
        if (ticket === selection) {
          message(`Unable to read result: ${error.message}`);
          $("retry").hidden = false;
        }
      }
    }
    async function openTrace() {
      if (!selected) return;
      const ticket = ++selection,
        run = selected,
        file = $("files").value;
      clearViewer();
      $("open").disabled = true;
      message("Reading trace from the cluster…");
      try {
        const buffer = await (
          await request(
            `api/trace?run=${encodeURIComponent(run.id)}&file=${encodeURIComponent(file)}`,
          )
        ).arrayBuffer();
        if (ticket !== selection) return;
        frame = document.createElement("iframe");
        frame.title = "Perfetto trace viewer";
        frame.referrerPolicy = "no-referrer";
        listener = (event) => {
          if (
            event.source !== frame?.contentWindow ||
            event.origin !== perfettoOrigin ||
            event.data !== "PONG"
          )
            return;
          clearInterval(ping);
          clearTimeout(handshakeTimeout);
          window.removeEventListener("message", listener);
          listener = null;
          frame.contentWindow.postMessage(
            {
              perfetto: {
                buffer,
                title: `${run.model || run.service} — ${run.name}`,
                fileName: file.split("/").pop(),
              },
            },
            perfettoOrigin,
            [buffer],
          );
          message(
            "Trace sent to Perfetto. Select another capture to browse history.",
          );
        };
        window.addEventListener("message", listener);
        frame.src = perfettoOrigin;
        $("viewer").append(frame);
        ping = setInterval(
          () => frame?.contentWindow.postMessage("PING", perfettoOrigin),
          200,
        );
        handshakeTimeout = setTimeout(() => {
          clearViewer();
          message(
            "Perfetto did not respond. Check access to ui.perfetto.dev and try again.",
          );
        }, 30000);
        message("Connecting to Perfetto…");
      } catch (error) {
        if (ticket === selection)
          message(`Unable to open trace: ${error.message}`);
      } finally {
        if (ticket === selection) $("open").disabled = false;
      }
    }
    $("refresh").onclick = refresh;
    $("retry").onclick = () => selected && selectRun(selected);
    $("open").onclick = openTrace;
    window.addEventListener("beforeunload", clearViewer);
    refresh();
  </script>
</html>
